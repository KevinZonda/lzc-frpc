<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KevinZonda FRPC Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .subtitle { color: #888; font-style: italic; margin-bottom: 1.5rem; font-size: 0.9rem; }

    .panel { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

    /* tabs */
    .tabs { display: flex; border-bottom: 1px solid #e5e7eb; }
    .tab-btn {
      padding: 0.65rem 1.25rem; border: none; background: none;
      cursor: pointer; font-size: 0.9rem; color: #888; border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab-btn.active { color: #3b82f6; border-bottom-color: #3b82f6; font-weight: 600; }
    .tab-content { display: none; padding: 1.25rem; }
    .tab-content.active { display: block; }

    /* toolbar */
    .toolbar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    button { padding: 0.4rem 1rem; border: none; border-radius: 5px; cursor: pointer; font-size: 0.9rem; }
    #fetchBtn  { background: #e8e8e8; color: #333; }
    #submitBtn { background: #3b82f6; color: #fff; }
    #startBtn  { background: #22c55e; color: #fff; }
    #clearLogBtn { background: #e8e8e8; color: #333; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-badge {
      margin-left: auto; padding: 0.25rem 0.75rem; border-radius: 99px;
      font-size: 0.8rem; font-weight: 600;
    }
    .status-badge.running { background: #dcfce7; color: #166534; }
    .status-badge.stopped { background: #fee2e2; color: #991b1b; }
    .status-badge.unknown { background: #e5e7eb; color: #374151; }

    textarea {
      width: 100%; height: 320px; font-family: monospace; font-size: 0.85rem;
      border: 1px solid #ddd; border-radius: 5px; padding: 0.75rem;
      resize: vertical; outline: none;
    }
    textarea:focus { border-color: #3b82f6; }

    /* log area */
    .log-meta { font-size: 0.75rem; color: #aaa; margin-bottom: 0.5rem; }
    #logPre {
      width: 100%; height: 380px; overflow-y: auto;
      background: #1a1a1a; color: #d4d4d4;
      font-family: monospace; font-size: 0.82rem;
      border-radius: 5px; padding: 0.75rem;
      white-space: pre-wrap; word-break: break-all;
    }
    #logPre .empty { color: #555; font-style: italic; }

    .footer { margin-top: 1.5rem; font-style: italic; color: #aaa; font-size: 0.8rem; }
  </style>
</head>

<body>
  <h1>KevinZonda FRPC Panel</h1>
  <p class="subtitle">Simple. Powerful.</p>

  <div class="panel">
    <div class="tabs">
      <button class="tab-btn active" data-tab="config">Config</button>
      <button class="tab-btn" data-tab="logs">Logs</button>
    </div>

    <!-- Config Tab -->
    <div id="tab-config" class="tab-content active">
      <div class="toolbar">
        <button id="fetchBtn"  type="button">Fetch Config</button>
        <button id="submitBtn" type="button">Save Config</button>
        <button id="startBtn"  type="button">Start</button>
        <span id="statusBadge" class="status-badge unknown">Unknown</span>
      </div>
      <textarea id="configTextarea" placeholder="Paste your frpc.toml config here..."></textarea>
    </div>

    <!-- Logs Tab -->
    <div id="tab-logs" class="tab-content">
      <div class="toolbar">
        <button id="clearLogBtn" type="button">Clear</button>
        <span id="logStatus" class="log-meta">Waiting for logs...</span>
        <span id="statusBadge2" class="status-badge unknown" style="margin-left:auto">Unknown</span>
      </div>
      <div id="logPre"><span class="empty">No logs yet. Start frpc to see output.</span></div>
    </div>
  </div>

  <p class="footer">Running on :443 via Lazycat Cloud.</p>

  <script>
    // ---- elements ----
    const submitBtn      = document.getElementById('submitBtn');
    const fetchBtn       = document.getElementById('fetchBtn');
    const startBtn       = document.getElementById('startBtn');
    const statusBadge    = document.getElementById('statusBadge');
    const statusBadge2   = document.getElementById('statusBadge2');
    const configTextarea = document.getElementById('configTextarea');
    const logPre         = document.getElementById('logPre');
    const logStatus      = document.getElementById('logStatus');
    const clearLogBtn    = document.getElementById('clearLogBtn');

    // ---- tabs ----
    let logPollTimer = null;

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');

        if (btn.dataset.tab === 'logs') {
          startLogPolling();
        } else {
          stopLogPolling();
        }
      });
    });

    // ---- status helpers ----
    function setStatus(status) {
      const label = status.charAt(0).toUpperCase() + status.slice(1);
      const cls   = ['running', 'stopped'].includes(status) ? status : 'unknown';
      [statusBadge, statusBadge2].forEach(b => {
        b.className = 'status-badge ' + cls;
        b.textContent = label;
      });
    }

    // ---- config tab ----
    async function refreshStatus() {
      try {
        const res  = await fetch('/api/frpc/status');
        const data = await res.json();
        setStatus(data.status);
        if (data.text) configTextarea.value = data.text;
      } catch {
        setStatus('unknown');
      }
    }

    async function saveConfig() {
      submitBtn.disabled = true;
      try {
        await fetch('/api/frpc/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: configTextarea.value }),
        });
      } finally {
        submitBtn.disabled = false;
      }
    }

    async function startFrpc() {
      startBtn.disabled = true;
      try {
        const res  = await fetch('/api/frpc/run', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) { alert('Error: ' + (data.error || 'unknown')); return; }
        await refreshStatus();
      } finally {
        startBtn.disabled = false;
      }
    }

    submitBtn.addEventListener('click', saveConfig);
    fetchBtn.addEventListener('click', refreshStatus);
    startBtn.addEventListener('click', startFrpc);

    // ---- logs tab ----
    let lastLineCount = 0;

    async function fetchLogs() {
      try {
        const [logRes, statusRes] = await Promise.all([
          fetch('/api/frpc/logs'),
          fetch('/api/frpc/status'),
        ]);
        const logData    = await logRes.json();
        const statusData = await statusRes.json();

        setStatus(statusData.status);

        const lines = logData.lines || [];
        if (lines.length === 0) {
          logPre.innerHTML = '<span class="empty">No logs yet. Start frpc to see output.</span>';
        } else {
          const atBottom = logPre.scrollHeight - logPre.scrollTop <= logPre.clientHeight + 40;
          logPre.textContent = lines.join('\n');
          if (atBottom || lines.length !== lastLineCount) {
            logPre.scrollTop = logPre.scrollHeight;
          }
        }
        lastLineCount = lines.length;
        logStatus.textContent = `${lines.length} line(s)`;
      } catch {
        logStatus.textContent = 'Failed to fetch logs';
      }
    }

    function startLogPolling() {
      fetchLogs();
      logPollTimer = setInterval(fetchLogs, 2000);
    }

    function stopLogPolling() {
      clearInterval(logPollTimer);
      logPollTimer = null;
    }

    clearLogBtn.addEventListener('click', async () => {
      // just clear the display; server buffer resets on next frpc start
      logPre.innerHTML = '<span class="empty">Cleared. Logs will reappear on next poll.</span>';
      lastLineCount = 0;
    });

    // ---- init ----
    refreshStatus();
    setInterval(refreshStatus, 3000);
  </script>
</body>

</html>
