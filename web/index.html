<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KevinZonda FRPC Panel</title>
</head>

<body>
  <h1>KevinZonda FRPC Panel</h1>
  <p style="font-style: italic">
    Simple. Powerful.
  </p>

  <section class="panel">
    <button id="fetchBtn" type="button">Fetch Config</button>
    <button id="submitBtn" type="button">Submit</button>
    <button id="startBtn" type="button">Start</button>
    <p id="statusTxt">Status: Unknown</p>
    <div class="form">
      <textarea id="configTextarea" placeholder="Config"></textarea>
    </div>
  </section>

  <hr>
  <p style="font-style: italic">
    Running on :443 via Lazycat Cloud.
  </p>


  <script>
    const submitBtn = document.getElementById("submitBtn")
    const fetchBtn = document.getElementById('fetchBtn');
    const startBtn = document.getElementById('startBtn');
    const statusTxt = document.getElementById('statusTxt');
    const configTextarea = document.getElementById('configTextarea');
    

    async function refreshStatus() {
      const status = await fetch('/api/frpc/status');
      statusTxt.textContent = `Status: ${status.status}`;
      configTextarea.value = status.text;
    }

    async function startFrpc() {
      await fetch('/api/frpc/run', {
        method: 'POST',
      });
    }

    async function updateConfig() {
      const title = todoInput.value.trim();
      if (!title) return;
      await fetch('/api/frpc/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: configTextarea.value }),
      });
    }

    submitBtn.addEventListener('click', updateConfig);
    fetchBtn.addEventListener('click', fetchTodos);
    startBtn.addEventListener('click', startFrpc);

    refreshStatus();
  </script>
</body>

</html>
